###############################################################################
# omnetpp.ini -- RL bring-up scenario (fixed workload, no parameter sweep)
#
# Scenario: T311_P5_light
# Source:   config_id=555_gcl_F50_G100_Batch_311_TT  run_id=722
# Topology: 311  |  Stream profile 5 (P5/P0)  |  Operating point: light
#
# This is a single fixed-workload run (not a batch sweep): the talker
# stream intervals/sizes below are taken verbatim from the selected
# RL scenario in rl_scenarios_v1.json.
#
# The Gate Control List is NOT included here -- it is the RL agent's
# action. Supply it at run time as a second ini via -f, e.g.:
#   opp_run -f T311_P5_light.ini -f <gcl_from_agent>.ini
###############################################################################

[General]
network = TsnIntelStar
sim-time-limit = 100ms

#Topology parameters
*.numTalkers   = 3
*.numListeners = 1

# Disable gPTP -- not needed for TAS-only experiments
*.*.hasTimeSynchronization = false

# 1 Gbps Intel-class links
**.eth[*].bitrate    = 1Gbps
**.channel.datarate  = 1Gbps

###############################################################################
# Workload (the AI reads this section to understand traffic patterns)
###############################################################################

# --- Talker 1: 2 applications, one per stream ---
*.talker[0].numApps = 2
# Stream 0: PCP5 traffic
*.talker[0].app[0].typename                     = "UdpSourceApp"
*.talker[0].app[0].display-name                 = "tt5Stream"
*.talker[0].app[0].source.packetLength          = 64B
*.talker[0].app[0].source.productionInterval    = 250us
*.talker[0].app[0].io.destAddress               = "listener[0]"
*.talker[0].app[0].io.destPort                  = 3000
# Stream 1: PCP0 traffic
*.talker[0].app[1].typename                     = "UdpSourceApp"
*.talker[0].app[1].display-name                 = "beStream"
*.talker[0].app[1].source.packetLength          = 1500B
*.talker[0].app[1].source.productionInterval    = 200us
*.talker[0].app[1].io.destAddress               = "listener[0]"
*.talker[0].app[1].io.destPort                  = 4000

# --- Talker 2: 2 applications, one per stream ---
*.talker[1].numApps = 2
# Stream 0: PCP5 traffic
*.talker[1].app[0].typename                     = "UdpSourceApp"
*.talker[1].app[0].display-name                 = "tt5Stream"
*.talker[1].app[0].source.packetLength          = 64B
*.talker[1].app[0].source.productionInterval    = 250us
*.talker[1].app[0].io.destAddress               = "listener[0]"
*.talker[1].app[0].io.destPort                  = 3000
# Stream 1: PCP0 traffic
*.talker[1].app[1].typename                     = "UdpSourceApp"
*.talker[1].app[1].display-name                 = "beStream"
*.talker[1].app[1].source.packetLength          = 1500B
*.talker[1].app[1].source.productionInterval    = 200us
*.talker[1].app[1].io.destAddress               = "listener[0]"
*.talker[1].app[1].io.destPort                  = 4000

# --- Talker 3: 2 applications, one per stream ---
*.talker[2].numApps = 2
# Stream 0: PCP5 traffic
*.talker[2].app[0].typename                     = "UdpSourceApp"
*.talker[2].app[0].display-name                 = "tt5Stream"
*.talker[2].app[0].source.packetLength          = 64B
*.talker[2].app[0].source.productionInterval    = 250us
*.talker[2].app[0].io.destAddress               = "listener[0]"
*.talker[2].app[0].io.destPort                  = 3000
# Stream 1: PCP0 traffic
*.talker[2].app[1].typename                     = "UdpSourceApp"
*.talker[2].app[1].display-name                 = "beStream"
*.talker[2].app[1].source.packetLength          = 1500B
*.talker[2].app[1].source.productionInterval    = 200us
*.talker[2].app[1].io.destAddress               = "listener[0]"
*.talker[2].app[1].io.destPort                  = 4000

# --- listener: 4 sinks (covers PCP7/6/5/0) ---
*.listener[*].numApps = 4
*.listener[*].app[0].display-name = "ttSink7"
*.listener[*].app[0].typename     = "UdpSinkApp"
*.listener[*].app[0].io.localPort = 1000
*.listener[*].app[1].display-name = "ttSink6"
*.listener[*].app[1].typename     = "UdpSinkApp"
*.listener[*].app[1].io.localPort = 2000
*.listener[*].app[2].display-name = "ttSink5"
*.listener[*].app[2].typename     = "UdpSinkApp"
*.listener[*].app[2].io.localPort = 3000
*.listener[*].app[3].display-name = "beSink"
*.listener[*].app[3].typename     = "UdpSinkApp"
*.listener[*].app[3].io.localPort = 4000

###############################################################################
# Stream identification & PCP tagging (Intel i226 PCP-to-queue mapping)
###############################################################################
*.talker[*].hasOutgoingStreams   = true
*.switch.hasIncomingStreams   = true
*.switch.hasOutgoingStreams   = true
*.switch.hasEgressTrafficShaping = true
*.listener[*].hasIncomingStreams = true

*.talker[0].bridging.streamIdentifier.identifier.mapping = [
    { stream: "T1STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T1STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) }]
*.talker[1].bridging.streamIdentifier.identifier.mapping = [
    { stream: "T2STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T2STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) }]
*.talker[2].bridging.streamIdentifier.identifier.mapping = [
    { stream: "T3STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T3STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) }]

*.switch.bridging.streamIdentifier.identifier.mapping = [
    { stream: "T1STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T1STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) },
    { stream: "T2STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T2STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) },
    { stream: "T3STR_01", packetFilter: expr(has(udp) && udp.destPort == 3000) },
    { stream: "T3STR_02", packetFilter: expr(has(udp) && udp.destPort == 4000) }]

*.talker[0].bridging.streamCoder.encoder.mapping = [
    { stream: "T1STR_01", pcp: 5 },
    { stream: "T1STR_02", pcp: 0 }]
*.talker[1].bridging.streamCoder.encoder.mapping = [
    { stream: "T2STR_01", pcp: 5 },
    { stream: "T2STR_02", pcp: 0 }]
*.talker[2].bridging.streamCoder.encoder.mapping = [
    { stream: "T3STR_01", pcp: 5 },
    { stream: "T3STR_02", pcp: 0 }]

*.switch.bridging.streamCoder.decoder.mapping = [
    { stream: "T1STR_01", pcp: 5 }, { stream: "T1STR_02", pcp: 0 },
    { stream: "T2STR_01", pcp: 5 }, { stream: "T2STR_02", pcp: 0 },
    { stream: "T3STR_01", pcp: 5 }, { stream: "T3STR_02", pcp: 0 }]
*.switch.bridging.streamCoder.encoder.mapping = [
    { stream: "T1STR_01", pcp: 5 }, { stream: "T1STR_02", pcp: 0 },
    { stream: "T2STR_01", pcp: 5 }, { stream: "T2STR_02", pcp: 0 },
    { stream: "T3STR_01", pcp: 5 }, { stream: "T3STR_02", pcp: 0 }]


###############################################################################
# TAS shaper on every switch egress (Intel i226: 4 traffic classes)
###############################################################################
*.switch.eth[*].macLayer.queue.typename           = "Ieee8021qTimeAwareShaper"
*.switch.eth[*].macLayer.queue.numTrafficClasses  = 4

# --- The Gate Control List itself (cycle, durations, initiallyOpen per queue)
# --- is the RL agent's action for this scenario -- it is NOT hardcoded here.
#--- Supply it at run time as a second ini via -f, e.g.:
#---   opp_run -f T311_P5_light.ini -f <gcl_from_agent>.ini
#--- Do NOT hardcode a GCL include here.

###############################################################################
# Statistics for the AI feedback loop
###############################################################################
**.scalar-recording                                                   = true
**.vector-recording                                                   = true

**.meanBitLifeTimePerPacket:vector.statistic-recording                = true
**.packetJitter:vector.statistic-recording                            = true
**.packetDelayVariation:vector.statistic-recording                    = true

**.queueLength:vector.statistic-recording                             = true
**.macLayer.queue.transmissionGate[*].open:vector.statistic-recording = true
**.packetDropped:count.statistic-recording                            = true

*.listener[*].app[*].io.**.result-recording-modes = all
*.listener[*].app[*].**.statistic-recording       = true

